name: ci
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SkillGuard.slnx
      - name: Build
        run: dotnet build SkillGuard.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test SkillGuard.slnx --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/SkillGuard.Cli/SkillGuard.Cli.csproj --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
